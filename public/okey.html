<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Online Okey</title><link rel="stylesheet" href="okey.css"></head>
<body>
<div id="join" class="join"><div class="joinCard"><div class="logo">🀄 OKEY</div><p>4 kişilik online masa</p><input id="name" placeholder="Oyuncu adın" maxlength="16"><input id="room" placeholder="Oda kodu" maxlength="12"><button id="enter">MASAYA GİR</button><a href="/">← Oyunlara dön</a></div></div>
<div id="game" class="hidden">
<header><a href="/" class="back">← Oyunlar</a><div class="brand">🀄 OKEY <span>Oda: <b id="roomLabel">-</b></span></div><div id="topMessage"></div></header>
<main>
<aside class="side"><div class="title">OKEY MASASI</div><button id="start">▶ Oyunu Başlat</button><button id="reset" class="red hidden">↻ Masayı Sıfırla</button><div class="line"></div><div id="host"></div><div class="line"></div><div>OYUNCULAR <b id="count">0/4</b></div><div id="players"></div><div class="help"><b>Oyun:</b> Sıra sende olduğunda ortadan veya atılan taştan bir taş al, sonra elinden bir taş at.</div></aside>
<section class="tableArea"><div class="table">
  <div class="indicator"><small>GÖSTERGE</small><div id="indicatorTile"></div><span id="jokerText">Okey: -</span></div>
  <div class="discard"><small>ATILAN</small><div id="discardTile" class="empty">—</div></div>
  <div class="wall"><div>ORTA</div><b id="wallCount">0</b><small>TAŞ</small></div>
  <div id="seats"></div>
  <div id="turnNotice" class="turnNotice hidden">SIRA SENDE</div>
</div>
<div class="handBar"><div class="handTitle"><span>ELİN</span><span id="handHint">Bir taş seç</span></div><div id="hand" class="hand"></div><div class="actions"><button id="draw">TAŞ ÇEK</button><button id="take" class="purple">ATILANI AL</button><button id="discard" class="gold">TAŞI AT</button></div></div>
</section></main>
<div id="toast" class="toast hidden"></div>
</div>
<script src="/socket.io/socket.io.js"></script><script src="okey.js"></script>
</body></html>
